databaseChangeLog:
  - changeSet:
      id: oauth-refresh-token-001
      author: https://github.com/daveclayton
      changes:
        - createTable:
            tableName: oauth_refresh_token
            columns:
              - column:
                  name: id
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: budget_user_id
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: oauth_client_id
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: VARCHAR(255)
              - column:
                  name: expiration_date
                  type: TIMESTAMP
