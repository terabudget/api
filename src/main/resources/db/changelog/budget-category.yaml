databaseChangeLog:
  - changeSet:
      id: budget-category-001
      author: https://github.com/daveclayton
      changes:
        - createTable:
            tableName: budget_category
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
