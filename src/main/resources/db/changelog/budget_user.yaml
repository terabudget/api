databaseChangeLog:
  - changeSet:
      id: budget-user-001
      author: https://github.com/daveclayton
      changes:
        - createTable:
            tableName: budget_user
            columns:
              - column:
                  name: id
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(20)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
